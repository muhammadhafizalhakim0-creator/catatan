<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Catatan</title>
  <style>
    * { box-sizing: border-box; }
    [hidden] { display: none !important; }

    body {
      font-family: system-ui, sans-serif;
      background: #f4f5f7;
      color: #1f2937;
      max-width: 520px;
      margin: 40px auto;
      padding: 0 16px;
    }
    h1 { margin: 0 0 16px; }

    form { display: flex; gap: 8px; margin-bottom: 12px; }
    #auth form { flex-direction: column; }

    input {
      flex: 1;
      padding: 10px 12px;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      font-size: 16px;
    }
    input:focus { outline: 2px solid #2563eb; border-color: transparent; }

    button {
      padding: 8px 14px;
      border: none;
      border-radius: 8px;
      background: #2563eb;
      color: white;
      font-size: 14px;
      cursor: pointer;
    }
    button:hover { background: #1d4ed8; }
    button.abu { background: #6b7280; }
    button.abu:hover { background: #4b5563; }
    button.merah { background: #dc2626; }
    button.merah:hover { background: #b91c1c; }
    button.hijau { background: #16a34a; }
    button.hijau:hover { background: #15803d; }

    .baris { display: flex; gap: 8px; }
    .baris button { flex: 1; padding: 10px; }

    .header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }
    .header h1 { margin: 0; }
    .user { display: flex; align-items: center; gap: 10px; font-size: 14px; }

    ul { list-style: none; padding: 0; margin: 0; }
    li {
      display: flex;
      align-items: center;
      gap: 8px;
      background: white;
      padding: 12px 14px;
      margin-bottom: 8px;
      border-radius: 10px;
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.08);
      word-break: break-word;
    }
    li span { flex: 1; }
    li input { padding: 6px 10px; font-size: 15px; min-width: 0; }

    #pesan { color: crimson; min-height: 1.2em; }
  </style>
</head>
<body>
  <p id="pesan"></p>

  <!-- Layar login -->
  <section id="auth" hidden>
    <h1>Catatan</h1>
    <form id="formAuth">
      <input id="username" placeholder="Username" autocomplete="username" required>
      <input id="password" type="password" placeholder="Password (min. 8 karakter)" autocomplete="current-password" required>
      <div class="baris">
        <button type="submit">Masuk</button>
        <button type="button" id="daftar" class="abu">Daftar</button>
      </div>
    </form>
  </section>

  <!-- Layar aplikasi -->
  <section id="app" hidden>
    <div class="header">
      <h1>Catatan</h1>
      <div class="user">
        <span id="who"></span>
        <button id="keluar" class="abu">Keluar</button>
      </div>
    </div>
    <form id="form">
      <input id="text" placeholder="Tulis catatan..." required>
      <button type="submit">Tambah</button>
    </form>
    <ul id="list"></ul>
  </section>

  <script>
    const $ = (id) => document.getElementById(id);
    const authBox = $('auth'), appBox = $('app'), pesan = $('pesan');
    const list = $('list'), input = $('text');

    function tampilkanLogin() {
      authBox.hidden = false;
      appBox.hidden = true;
      list.innerHTML = '';
    }

    function tampilkanApp(username) {
      authBox.hidden = true;
      appBox.hidden = false;
      $('who').textContent = username;
      load();
    }

    // Satu fungsi untuk semua permintaan ke server
    async function kirim(url, options) {
      try {
        const res = await fetch(url, options);
        if (!res.ok) {
          const data = await res.json().catch(() => ({}));
          if (res.status === 401 && url !== '/api/login') tampilkanLogin();
          throw new Error(data.error || 'Server menjawab error ' + res.status);
        }
        pesan.textContent = '';
        return res;
      } catch (err) {
        pesan.textContent = err instanceof TypeError
          ? 'Server tidak bisa dihubungi. Perubahan belum tersimpan.'
          : err.message;
        return null;
      }
    }

    function jsonBody(data) {
      return {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(data)
      };
    }

    // ----- Login / daftar / keluar -----
    async function auth(path) {
      const res = await kirim(path, jsonBody({
        username: $('username').value,
        password: $('password').value
      }));
      if (!res) return;
      const data = await res.json();
      $('password').value = '';
      tampilkanApp(data.username);
    }

    $('formAuth').addEventListener('submit', (e) => { e.preventDefault(); auth('/api/login'); });
    $('daftar').onclick = () => {
      if ($('formAuth').reportValidity()) auth('/api/register');
    };
    $('keluar').onclick = async () => {
      await kirim('/api/logout', { method: 'POST' });
      tampilkanLogin();
    };

    // ----- Catatan -----
    async function load() {
      const res = await kirim('/api/notes');
      if (!res) return;
      const notes = await res.json();
      list.innerHTML = '';

      notes.forEach(n => {
        const li = document.createElement('li');
        const teks = document.createElement('span');
        teks.textContent = n.text;

        const edit = document.createElement('button');
        edit.textContent = 'Edit';
        edit.className = 'abu';
        edit.onclick = () => mulaiEdit(li, n);

        const del = document.createElement('button');
        del.textContent = 'Hapus';
        del.className = 'merah';
        del.onclick = async () => {
          const ok = await kirim('/api/notes/' + n.id, { method: 'DELETE' });
          if (ok) load();
        };

        li.append(teks, edit, del);
        list.appendChild(li);
      });
    }

    function mulaiEdit(li, n) {
      li.innerHTML = '';

      const field = document.createElement('input');
      field.value = n.text;

      const simpan = document.createElement('button');
      simpan.textContent = 'Simpan';
      simpan.className = 'hijau';

      const batal = document.createElement('button');
      batal.textContent = 'Batal';
      batal.className = 'abu';

      async function kirimEdit() {
        const baru = field.value.trim();
        if (!baru) return;
        const ok = await kirim('/api/notes/' + n.id, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ text: baru })
        });
        if (ok) load();
      }

      simpan.onclick = kirimEdit;
      batal.onclick = load;
      field.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') kirimEdit();
        if (e.key === 'Escape') load();
      });

      li.append(field, simpan, batal);
      field.focus();
      field.select();
    }

    $('form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const ok = await kirim('/api/notes', jsonBody({ text: input.value }));
      if (ok) {
        input.value = '';
        load();
      }
    });

    // ----- Saat halaman dibuka: sudah login atau belum? -----
    (async () => {
      try {
        const res = await fetch('/api/me');
        if (res.ok) tampilkanApp((await res.json()).username);
        else tampilkanLogin();
      } catch {
        tampilkanLogin();
        pesan.textContent = 'Server tidak bisa dihubungi.';
      }
    })();
  </script>
</body>
</html>
